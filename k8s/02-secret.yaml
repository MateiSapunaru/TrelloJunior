# JWT_SECRET and MONGO_URI, kept out of the ConfigMap on the same principle as any
# credential/connection-string: even though this particular Mongo has no auth (see
# 04-mongo-statefulset.yaml), a connection string is the kind of value that *usually*
# carries credentials, so it belongs in a Secret by convention rather than by what this
# one demo instance happens to need.
#
# This is a plaintext demo value committed to the repo, not a real secret - Kubernetes
# Secrets are base64-encoded, not encrypted, and this cluster is torn down at the end of
# every CI run anyway. A real deployment would source this from a proper secret manager
# (Sealed Secrets, External Secrets Operator, or the cloud provider's KMS) instead of a
# plain manifest - see the README for why that's out of scope here.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: trellojunior
type: Opaque
stringData:
  JWT_SECRET: "kind-demo-secret-not-for-production"
  # "mongo", not localhost - resolved via the mongo Service (03-mongo-service.yaml)
  # over the cluster's internal DNS, same reasoning as docker-compose's service-name
  # addressing.
  MONGO_URI: "mongodb://mongo:27017/trellojunior"
