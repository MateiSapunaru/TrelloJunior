name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  # Functional + security tests (Vitest/Supertest). No Mongo service needed here -
  # this suite starts its own throwaway mongod via mongodb-memory-server
  # (tests/globalSetup.ts), same as running it locally.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # mongodb-memory-server downloads a real mongod binary (~700MB) on first
      # use - caching it is the difference between this job taking a couple of
      # minutes and it taking a couple of minutes plus a large one-time download
      # on every single run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm ci
      - run: npm test -w packages/api

  # Pact: consumer test generates the contract, provider verification replays it
  # against the real Express app. Both run in this one job since the provider
  # step needs the file the consumer step just wrote - splitting them across
  # parallel jobs would just add an artifact hand-off for no benefit.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm ci
      - run: npm run test:pact -w packages/web
      - run: npm run test:pact -w packages/api

  # Playwright E2E. Needs the real app actually running, so unlike the api job
  # this needs a real MongoDB - a GitHub Actions service container, not
  # docker-compose (a test runner shouldn't orchestrate Docker itself; see the
  # README for the same reasoning applied to local dev).
  ui:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/trellojunior
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: "4000"
      VITE_API_URL: http://localhost:4000
      # Chromium + WebKit run locally too; Firefox is added here specifically -
      # excluded locally only because this dev machine is missing a Windows
      # system dependency (Visual C++ Redistributable) that a clean Linux
      # runner doesn't need.
      PLAYWRIGHT_PROJECTS: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: packages/e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 14
      # When a baseline doesn't exist yet, Playwright still writes the actual
      # capture into tests/*-snapshots/ (and fails the assertion, correctly -
      # CI should never silently accept a new baseline). Uploading it separately
      # is what lets a human download and commit it as the real baseline
      # afterward, rather than that image only ever existing on the runner.
      - name: Upload visual snapshots (new or changed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: packages/e2e/tests/**/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Generate Allure report
        if: always()
        working-directory: packages/e2e
        run: npm run report:allure
      # A CI artifact, same as the Playwright HTML report above - not published
      # anywhere persistent (see the README's "Allure Report" section for why
      # that's a deliberate scope cut, not an oversight).
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: packages/e2e/allure-report/
          retention-days: 14
      - name: Summarize Allure results and notify n8n
        if: always()
        continue-on-error: true
        env:
          N8N_ALLURE_WEBHOOK_URL: ${{ secrets.N8N_ALLURE_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/notify-allure-summary.mjs

  # OWASP ZAP baseline scan: a passive-only DAST pass against the running app,
  # not a re-run of the Vitest security tests (those already live in the api
  # job and test unit/functional-level authz/JWT/rate-limit behavior - this is
  # a genuinely different kind of check).
  security:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/trellojunior
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://localhost:5173
      PORT: "4000"
      VITE_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/api
      - run: npm run build -w packages/web
      - name: Start the app in the background
        run: |
          nohup npm start -w packages/api > api.log 2>&1 &
          nohup npm run preview -w packages/web -- --port 5173 --host 0.0.0.0 > web.log 2>&1 &
      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null && curl -sf http://localhost:5173 > /dev/null; then
              echo "app is up"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become ready in time"
          cat api.log web.log
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:5173"
          # This is the actual deliverable (a build artifact the action uploads
          # itself) - not a GitHub issue opened on every run, which is the
          # action's default and not something a scheduled/on-push scan should
          # do unprompted.
          allow_issue_writing: false
          # Baseline findings are informational by default at this scope (see
          # README) - the report is the deliverable, not a hard merge gate.
          fail_action: false
          artifact_name: zap-baseline-report
      # report_json.json is written by the action above into the job's working
      # directory (repo root) regardless of artifact_name - that's what this
      # reads, not the uploaded artifact.
      - name: Summarize ZAP findings and notify n8n
        if: always()
        continue-on-error: true
        env:
          N8N_ZAP_WEBHOOK_URL: ${{ secrets.N8N_ZAP_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/notify-zap-findings.mjs

  # Smoke-checks that both Dockerfiles actually build - doesn't push anywhere or
  # use these images to power the other jobs (see README for why CI uses native
  # service containers instead of docker-compose to run the test jobs).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/api/Dockerfile -t trellojunior-api .
      - run: docker build -f packages/web/Dockerfile -t trellojunior-web .

  # Deploys the app to a throwaway Kubernetes cluster and confirms it actually comes
  # up - a portfolio-scope demonstration of the k8s manifests in /k8s, not a real
  # deployment target (see README for the full "why kind, not a managed cluster"
  # writeup). Independent of the docker job above: this one needs the images loaded
  # into a live cluster, not just built.
  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: trellojunior

      # Same two Dockerfiles as the docker job, tagged for local use inside the kind
      # node rather than a registry - `kind load docker-image` below is what actually
      # gets them there, so there's nothing to push anywhere.
      - run: docker build -f packages/api/Dockerfile -t trellojunior-api:kind .
      - run: docker build -f packages/web/Dockerfile -t trellojunior-web:kind .
      - run: kind load docker-image trellojunior-api:kind --name trellojunior
      - run: kind load docker-image trellojunior-web:kind --name trellojunior

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=mongo -n trellojunior --timeout=120s
          kubectl wait --for=condition=available deployment/api -n trellojunior --timeout=120s
          kubectl wait --for=condition=available deployment/web -n trellojunior --timeout=120s

      # Proves the deployed stack actually works end to end (api reachable, and able
      # to talk to Mongo), not just that the pods started - a health check alone
      # wouldn't catch a broken MONGO_URI/Secret wiring, for example.
      - name: Smoke test via kubectl port-forward
        run: |
          kubectl port-forward svc/api 4000:4000 -n trellojunior &
          PF_PID=$!
          sleep 3
          curl -sf http://localhost:4000/health
          curl -sf -X POST http://localhost:4000/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"k8s-smoke@example.com","password":"supersecret123","name":"K8s Smoke Test"}'
          kill $PF_PID

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name trellojunior

  # Reports the overall pipeline result to an n8n workflow (see /n8n-workflows), which
  # forwards it to Discord. `always()` so this still fires on a failed run - that's the
  # more useful notification, not the one to skip. continue-on-error because a missing
  # or misconfigured N8N_WEBHOOK_URL secret (e.g. on a fork of this repo) shouldn't fail
  # the pipeline over a notification.
  notify:
    runs-on: ubuntu-latest
    needs: [api, contract, ui, security, docker, k8s]
    if: always()
    steps:
      - name: Send CI result to n8n
        continue-on-error: true
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          OVERALL_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi
          curl -sf -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"overall_status\": \"$OVERALL_STATUS\",
              \"repository\": \"${{ github.repository }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"run_url\": \"$RUN_URL\",
              \"jobs\": {
                \"api\": \"${{ needs.api.result }}\",
                \"contract\": \"${{ needs.contract.result }}\",
                \"ui\": \"${{ needs.ui.result }}\",
                \"security\": \"${{ needs.security.result }}\",
                \"docker\": \"${{ needs.docker.result }}\",
                \"k8s\": \"${{ needs.k8s.result }}\"
              }
            }"
