server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Response headers the ZAP baseline scan (see README) flagged as missing.
    # connect-src is hardcoded to localhost:4000 to match VITE_API_URL, which is
    # already baked into the JS bundle at build time for the same reason - both
    # assume this container's API origin, and both need a rebuild if that changes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:4000; img-src 'self' data:; frame-ancestors 'none'" always;

    # React Router handles client-side routes like /boards/:id - without this
    # fallback, refreshing on a nested route would 404 at the nginx level before
    # React ever gets a chance to render it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
