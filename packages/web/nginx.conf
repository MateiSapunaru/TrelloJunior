server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles client-side routes like /boards/:id - without this
    # fallback, refreshing on a nested route would 404 at the nginx level before
    # React ever gets a chance to render it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
